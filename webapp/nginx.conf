worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Die Freigabeseite liefert alle Auftraege samt Bauteilzeilen aus - als
    # HTML schnell einige MB. Komprimiert bleiben davon wenige Prozent.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name dfki-3129.dfki.de;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name dfki-3129.dfki.de;

        ssl_certificate /etc/letsencrypt/live/dfki-3129.dfki.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dfki-3129.dfki.de/privkey.pem;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 100M;

        location / {
            proxy_pass http://webapp:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /labelstudio/ {
            # Docker vergibt beim Neuerstellen eines Containers eine neue IP.
            # Ohne Resolver loest nginx den Upstream nur beim Start auf und
            # laeuft danach in "connection refused" - deshalb der interne
            # Docker-DNS und ein Variablen-Upstream, der pro Anfrage aufgeloest
            # wird. Das Praefix strippt das rewrite, da proxy_pass mit Variable
            # die URI nicht selbst ersetzt.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $labelstudio_upstream http://labelstudio:8080;
            rewrite ^/labelstudio/(.*)$ /$1 break;
            proxy_pass $labelstudio_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
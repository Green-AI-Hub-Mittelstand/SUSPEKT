services:
  webapp:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Service-to-service: the webapp container reaches Label Studio via the
      # compose network, the browser link keeps using the host port.
      - LABEL_STUDIO_API_URL=http://labelstudio:8080/api/projects/{id}/export?exportType=JSON
      - LABEL_STUDIO_BASE_URL=http://localhost:8082
      - LABEL_STUDIO_MEDIA_DIR=/label-studio-media/upload
    volumes:
      - ./labelstudio-data/media:/label-studio-media:ro
      # Shared with the labelstudio service (same path there) so the setup
      # assistant can create per-project subfolders and read synced images.
      - ./training_captures:/label-studio/files
      # Persists the Label Studio token entered on the /training page.
      - ./config:/app/config
    restart: always

  labelstudio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8082:8080"
    volumes:
      - ./labelstudio-data:/label-studio/data
      - ./training_captures:/label-studio/files:ro
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - webapp
    profiles:
      - production  # Only runs in --profile production
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always

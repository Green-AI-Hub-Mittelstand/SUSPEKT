services:
  webapp:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Service-to-service: the webapp container reaches Label Studio directly
      # via the compose network (no /labelstudio prefix — that prefix is only
      # for URLs generated for the browser, via LABEL_STUDIO_HOST below).
      - LABEL_STUDIO_API_URL=http://labelstudio:8080/api/projects/{id}/export?exportType=JSON
      - LABEL_STUDIO_BASE_URL=https://dfki-3129.dfki.de/labelstudio
      - LABEL_STUDIO_MEDIA_DIR=/label-studio-media/upload
      # Default (fallback) model for detection/prelabeling/export. The active
      # version is set on the /training page (drag & drop upload) and stored in
      # config/models.json — this value is only used until a version is
      # activated there.
      - MODEL_NAME=system180custommodel_v1.pt
      # Local Neo4j (see the neo4j service below) instead of Aura; overrides
      # NEO4J_URI/USER/PASSWORD from .env so compose always talks to it.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-suspekt-local-neo4j}
    depends_on:
      - neo4j
    volumes:
      - ./labelstudio-data/media:/label-studio-media:ro
      # Kundenaufnahmen samt Labels als Trainingsmaterial. Liegt neben den
      # uebrigen Label-Studio-Daten und ueberlebt damit einen Rebuild.
      - ./labelstudio-data/saved_customer_files:/app/labelstudio-data/saved_customer_files
      # Shared with the labelstudio service (same path there) so the setup
      # assistant can create per-project subfolders and read synced images.
      - ./training_captures:/label-studio/files
      # Persists the Label Studio token entered on the /training page.
      - ./config:/app/config
      # Model versions uploaded on the /training page (drag & drop) must
      # survive container rebuilds.
      - ./model:/app/model
    restart: always

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-suspekt-local-neo4j}
    volumes:
      - ./neo4j-data/data:/data
      - ./neo4j-data/logs:/logs
    restart: always

  labelstudio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8082:8080"
    volumes:
      - ./labelstudio-data:/label-studio/data
      # Nicht read-only: Docker muss hier den Einhaengepunkt fuer den
      # verschachtelten kundenbilder-Mount anlegen koennen.
      - ./training_captures:/label-studio/files
      # Kundenaufnahmen liegen nur einmal (in saved_customer_files/images) und
      # werden hier zusaetzlich in den Dateiwurzel-Baum von Label Studio
      # eingehaengt - so entsteht keine zweite Kopie.
      - ./labelstudio-data/saved_customer_files/images:/label-studio/files/kundenbilder:ro
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      # Served behind nginx under /labelstudio (dfki-3129 only exposes 80/443
      # externally); this makes Label Studio generate all URLs with that
      # prefix instead of assuming it owns the domain root.
      - LABEL_STUDIO_HOST=https://dfki-3129.dfki.de/labelstudio
      # Django can't tell the proxied request was HTTPS, so its CSRF Origin
      # check (which assumes http) fails without this explicit allowlist.
      - CSRF_TRUSTED_ORIGINS=https://dfki-3129.dfki.de
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - webapp
    profiles:
      - production  # Only runs in --profile production
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
